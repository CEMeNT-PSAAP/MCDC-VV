  <rect x="80" y="505" width="800" height="34" rx="5" fill="#f3f6f8" stroke="#b9c4cc"/>
  <text x="480" y="527" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">Reconstructed diagram—not an original SINBAD figure and not a substitute for the revised package geometry.</text>
