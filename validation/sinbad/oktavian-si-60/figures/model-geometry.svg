  <text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Cross section through the modeled beam axis; dimensions are from the public NEA abstract.</text>
  <circle cx="310" cy="300" r="214" fill="#5f6670"/>
  <circle cx="310" cy="300" r="207" fill="#8ecae6"/>
  <circle cx="310" cy="300" r="71" fill="#5f6670"/>
  <circle cx="310" cy="300" r="67" fill="#ffffff"/>
  <rect x="310" y="262" width="214" height="76" fill="#ffffff"/>
  <circle cx="310" cy="300" r="7" fill="#d1495b"/>
  <line x1="310" y1="300" x2="548" y2="300" stroke="#d1495b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="557" y="306" font-family="sans-serif" font-size="15" fill="#d1495b">+z / target-beam axis</text>
  <line x1="310" y1="300" x2="310" y2="86" stroke="#173f5f" stroke-width="1.5"/>
  <line x1="300" y1="86" x2="320" y2="86" stroke="#173f5f" stroke-width="1.5"/>
  <text x="324" y="94" font-family="sans-serif" font-size="15" fill="#173f5f">30.5 cm outer radius</text>
  <line x1="310" y1="300" x2="243" y2="300" stroke="#173f5f" stroke-width="1.5"/>
  <text x="94" y="292" font-family="sans-serif" font-size="15" fill="#173f5f">10 cm void radius</text>
  <line x1="419" y1="219" x2="633" y2="141" stroke="#173f5f" stroke-width="1.3"/>
  <text x="644" y="144" font-family="sans-serif" font-size="16" fill="#173f5f">Granular natural silicon</text>
  <text x="644" y="166" font-family="sans-serif" font-size="14" fill="#555555">1.29 g/cm³; 99.9% minimum purity</text>
  <line x1="463" y1="150" x2="633" y2="204" stroke="#173f5f" stroke-width="1.3"/>
  <text x="644" y="208" font-family="sans-serif" font-size="16" fill="#173f5f">Outer stainless-steel wall</text>
  <text x="644" y="230" font-family="sans-serif" font-size="14" fill="#555555">0.5 cm thickness</text>
  <line x1="376" y1="286" x2="633" y2="265" stroke="#173f5f" stroke-width="1.3"/>
  <text x="644" y="270" font-family="sans-serif" font-size="16" fill="#173f5f">Inner stainless-steel wall</text>
  <text x="644" y="292" font-family="sans-serif" font-size="14" fill="#555555">0.2 cm thickness</text>
  <line x1="474" y1="338" x2="633" y2="346" stroke="#173f5f" stroke-width="1.3"/>
  <text x="644" y="351" font-family="sans-serif" font-size="16" fill="#173f5f">Reentrant void</text>
  <text x="644" y="373" font-family="sans-serif" font-size="14" fill="#555555">11 cm diameter; modeled one-sided</text>
  <line x1="310" y1="300" x2="633" y2="408" stroke="#173f5f" stroke-width="1.3"/>
  <text x="644" y="413" font-family="sans-serif" font-size="16" fill="#173f5f">Central isotropic source</text>
