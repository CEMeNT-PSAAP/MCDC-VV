<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#173f5f">Public-entry measurement arrangement</text>
  <text x="480" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Schematic only; distances are labeled but the drawing is not to scale.</text>
